<rect x="17.5" y="17.5" width="25.0" height="2.5"/>
<rect x="2.5" y="20.0" width="7.5" height="2.5"/>
<rect x="15.0" y="20.0" width="22.5" height="2.5"/>
<rect x="40.0" y="20.0" width="2.5" height="2.5"/>
<rect x="2.5" y="22.5" width="35.0" height="2.5"/>
<rect x="5.0" y="25.0" width="32.5" height="2.5"/>
<rect x="7.5" y="27.5" width="30.0" height="2.5"/>
<rect x="10.0" y="30.0" width="25.0" height="2.5"/>
<rect x="12.5" y="32.5" width="20.0" height="2.5"/>
<rect x="15.0" y="35.0" width="15.0" height="2.5"/>
<rect x="15.0" y="37.5" width="10.0" height="2.5"/>
<rect x="27.5" y="37.5" width="5.0" height="2.5"/>
      <g transform="translate(0,40)">
<rect x="15.0" y="0.0" width="7.5" height="2.5"/>
<rect x="30.0" y="0.0" width="5.0" height="2.5"/>
<rect x="15.0" y="2.5" width="5.0" height="2.5"/>
<rect x="32.5" y="2.5" width="2.5" height="2.5"/>
<rect x="15.0" y="5.0" width="2.5" height="2.5"/>
