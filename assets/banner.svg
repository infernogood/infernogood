<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 850 220" role="img" aria-label="infernogood animated dino banner">
  <defs>
    <style>
      <![CDATA[
      text { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .frame { fill: #0A0A0A; stroke: #262626; stroke-width: 1; }
      .corner { stroke: #FFFFFF; stroke-width: 2; fill: none; }
      .ground { stroke: #333333; stroke-width: 2; stroke-dasharray: 8 8; fill: none; }
      .letter { font-size: 24; font-weight: 800; fill: #888888; transform-box: fill-box; transform-origin: center; }
      .dino, .ground, .move-in, .move-fer, .move-no, .move-good, .flash-in, .flash-fer, .flash-no, .flash-good, .game-ui, .final-hero, .leg-a, .leg-b {
        transform-box: fill-box; transform-origin: center;
      }
      .dino { fill: #FFFFFF; }

      @keyframes dinoRun {
        0%, 12% { transform: translate(120px,100px); opacity: 1; animation-timing-function: linear; }
        12.5% { transform: translate(120px,100px); opacity: 1; animation-timing-function: cubic-bezier(0.22,0.61,0.36,1); }
        14% { transform: translate(120px,70px); opacity: 1; animation-timing-function: cubic-bezier(0.45,0,0.9,0.45); }
        15.5% { transform: translate(120px,100px); opacity: 1; animation-timing-function: linear; }
        22.5% { transform: translate(120px,100px); opacity: 1; animation-timing-function: cubic-bezier(0.22,0.61,0.36,1); }
        24% { transform: translate(120px,70px); opacity: 1; animation-timing-function: cubic-bezier(0.45,0,0.9,0.45); }
        25.5% { transform: translate(120px,100px); opacity: 1; animation-timing-function: linear; }
        35.5% { transform: translate(120px,100px); opacity: 1; animation-timing-function: cubic-bezier(0.22,0.61,0.36,1); }
        37% { transform: translate(120px,70px); opacity: 1; animation-timing-function: cubic-bezier(0.45,0,0.9,0.45); }
        38.5% { transform: translate(120px,100px); opacity: 1; animation-timing-function: linear; }
        48.5% { transform: translate(120px,100px); opacity: 1; animation-timing-function: cubic-bezier(0.22,0.61,0.36,1); }
        50% { transform: translate(120px,70px); opacity: 1; animation-timing-function: cubic-bezier(0.45,0,0.9,0.45); }
        51.5% { transform: translate(120px,100px); opacity: 1; animation-timing-function: linear; }
        55%, 60% { transform: translate(120px,100px); opacity: 0; }
        100% { transform: translate(120px,100px); opacity: 0; }
      }

      @keyframes groundMove {
        0% { stroke-dashoffset: 0; opacity: 1; }
        55% { stroke-dashoffset: -1200; opacity: 1; }
        60% { stroke-dashoffset: -1200; opacity: 0; }
        100% { stroke-dashoffset: -1200; opacity: 0; }
      }

      @keyframes legA {
        0% { opacity: 1; }
        50% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes legB {
        0% { opacity: 0; }
        50% { opacity: 1; }
        100% { opacity: 0; }
      }

      @keyframes moveIn {
        0%, 4% { transform: translate(860px,0px); opacity: 0; }
        4.01% { opacity: 1; }
        14% { transform: translate(120px,0px); }
        20% { transform: translate(-120px,0px); opacity: 0; }
        100% { transform: translate(-120px,0px); opacity: 0; }
      }
      @keyframes moveFer {
        0%, 18% { transform: translate(860px,0px); opacity: 0; }
        18.01% { opacity: 1; }
        24% { transform: translate(120px,0px); }
        30% { transform: translate(-120px,0px); opacity: 0; }
        100% { transform: translate(-120px,0px); opacity: 0; }
      }
      @keyframes moveNo {
        0%, 31% { transform: translate(860px,0px); opacity: 0; }
        31.01% { opacity: 1; }
        37% { transform: translate(120px,0px); }
        43% { transform: translate(-120px,0px); opacity: 0; }
        100% { transform: translate(-120px,0px); opacity: 0; }
      }
      @keyframes moveGood {
        0%, 44% { transform: translate(860px,0px); opacity: 0; }
        44.01% { opacity: 1; }
        50% { transform: translate(120px,0px); }
        56% { transform: translate(-120px,0px); opacity: 0; }
        100% { transform: translate(-120px,0px); opacity: 0; }
      }

      @keyframes flashIn {
        0%, 10%, 18% { fill: #888888; transform: translateY(0px); filter: none; }
        14% { fill: #FFFFFF; transform: translateY(-2px); filter: drop-shadow(0 0 6px rgba(255,255,255,0.6)); }
        100% { fill: #888888; transform: translateY(0px); filter: none; }
      }
      @keyframes flashFer {
        0%, 20%, 28% { fill: #888888; transform: translateY(0px); filter: none; }
        24% { fill: #FFFFFF; transform: translateY(-2px); filter: drop-shadow(0 0 6px rgba(255,255,255,0.6)); }
        100% { fill: #888888; transform: translateY(0px); filter: none; }
      }
      @keyframes flashNo {
        0%, 33%, 41% { fill: #888888; transform: translateY(0px); filter: none; }
        37% { fill: #FFFFFF; transform: translateY(-2px); filter: drop-shadow(0 0 6px rgba(255,255,255,0.6)); }
        100% { fill: #888888; transform: translateY(0px); filter: none; }
      }
      @keyframes flashGood {
        0%, 46%, 54% { fill: #888888; transform: translateY(0px); filter: none; }
        50% { fill: #FFFFFF; transform: translateY(-2px); filter: drop-shadow(0 0 6px rgba(255,255,255,0.6)); }
        100% { fill: #888888; transform: translateY(0px); filter: none; }
      }

      @keyframes gameUi {
        0%, 55% { opacity: 1; }
        60%, 100% { opacity: 0; }
      }

      @keyframes finalHero {
        0%, 55% { transform: translate(425px,110px) scale(0.85); opacity: 0; }
        68%, 92% { transform: translate(425px,110px) scale(1.12); opacity: 1; }
        100% { transform: translate(425px,110px) scale(0.85); opacity: 0; }
      }

      .dino { animation: dinoRun 10s linear infinite; }
      .ground { animation: groundMove 10s linear infinite; }
      .leg-a { animation: legA 0.18s steps(2) infinite; }
      .leg-b { animation: legB 0.18s steps(2) infinite; }
      .move-in { animation: moveIn 10s linear infinite; }
      .move-fer { animation: moveFer 10s linear infinite; }
      .move-no { animation: moveNo 10s linear infinite; }
      .move-good { animation: moveGood 10s linear infinite; }
      .flash-in { animation: flashIn 10s ease-in-out infinite; }
      .flash-fer { animation: flashFer 10s ease-in-out infinite; }
      .flash-no { animation: flashNo 10s ease-in-out infinite; }
      .flash-good { animation: flashGood 10s ease-in-out infinite; }
      .game-ui { animation: gameUi 10s ease-in-out infinite; }
      .final-hero { animation: finalHero 10s ease-in-out infinite; }
      ]]>
    </style>
  </defs>

  <rect class="frame" x="0" y="0" width="850" height="220" rx="4" ry="4"/>
  <path class="corner" d="M10,0 L0,10 M840,0 L850,10 M0,210 L10,220 M840,220 L850,210"/>

  <line class="ground" x1="0" y1="155" x2="850" y2="155"/>

  <g class="dino">
<rect x="25.0" y="0.0" width="20.0" height="2.5"/>
