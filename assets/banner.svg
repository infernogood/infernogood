<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="infernogood animated dino banner">
  <defs>
    <style>
      <![CDATA[
      @keyframes run {
        0%   { transform: translate(40px, 150px) scale(1); }
        60%  { transform: translate(760px, 150px) scale(1); }
        75%  { transform: translate(760px, 150px) scale(1.15); }
        90%  { transform: translate(40px, 150px) scale(1.15); }
        100% { transform: translate(40px, 150px) scale(1); }
      }
      @keyframes jump {
        0%,10%,20%,30%,40%,50%,60%,100% { transform: translateY(0); }
        5%,15%,25%,35%,45%,55% { transform: translateY(-46px); }
      }
      @keyframes zoomIn {
        0%,60% { transform: scale(1); }
        75%,90% { transform: scale(1.18); }
        100% { transform: scale(1); }
      }
      @keyframes fadeName {
        0%,65% { opacity: 0; }
        78%,90% { opacity: 1; }
        100% { opacity: 0; }
      }
      .scene { animation: zoomIn 8s ease-in-out infinite; transform-origin: 450px 120px; }
      .dino { animation: run 8s linear infinite, jump 8s ease-in-out infinite; }
      .name { animation: fadeName 8s ease-in-out infinite; font-family: 'JetBrains Mono','Press Start 2P',monospace; }
      text { font-family: 'JetBrains Mono','Press Start 2P',monospace; }
      ]]>
    </style>
  </defs>
  <rect width="900" height="240" fill="#141413"/>
  <g class="scene">
    <!-- obstacles letters -->
    <g fill="#E5C07B" font-size="34" font-weight="700">
      <text x="120" y="180">I</text>
      <text x="200" y="180">N</text>
      <text x="280" y="180">F</text>
      <text x="360" y="180">E</text>
      <text x="440" y="180">R</text>
      <text x="520" y="180">N</text>
      <text x="600" y="180">O</text>
      <text x="680" y="180">G</text>
      <text x="760" y="180">O</text>
      <text x="840" y="180">O</text>
      <text x="920" y="180">D</text>
    </g>
    <!-- ground -->
    <rect x="0" y="195" width="900" height="2" fill="#3FB950"/>
    <!-- dino pixel -->
    <g class="dino">
      <rect x="0" y="0" width="8" height="8" fill="#FFFFFF"/>
      <rect x="8" y="0" width="8" height="8" fill="#FFFFFF"/>
      <rect x="16" y="0" width="8" height="8" fill="#FFFFFF"/>
      <rect x="0" y="8" width="8" height="8" fill="#FFFFFF"/>
      <rect x="8" y="8" width="8" height="8" fill="#141413"/>
      <rect x="16" y="8" width="8" height="8" fill="#FFFFFF"/>
      <rect x="24" y="8" width="8" height="8" fill="#FFFFFF"/>
      <rect x="0" y="16" width="8" height="8" fill="#FFFFFF"/>
      <rect x="8" y="16" width="8" height="8" fill="#FFFFFF"/>
      <rect x="16" y="16" width="8" height="8" fill="#FFFFFF"/>
      <rect x="24" y="16" width="8" height="8" fill="#FFFFFF"/>
      <rect x="8" y="24" width="8" height="8" fill="#FFFFFF"/>
      <rect x="24" y="24" width="8" height="8" fill="#FFFFFF"/>
      <rect x="8" y="32" width="8" height="8" fill="#FFFFFF"/>
      <rect x="24" y="32" width="8" height="8" fill="#FFFFFF"/>
    </g>
  </g>
  <!-- final name -->
  <text class="name" x="60" y="60" font-size="28" fill="#FFFFFF" font-weight="700">ARSENIY DEYS</text>
  <text class="name" x="330" y="60" font-size="28" fill="#7A7A7A" font-weight="700"> // </text>
  <text class="name" x="390" y="60" font-size="28" fill="#FFFFFF" font-weight="700">INFERNOGOOD</text>
</svg>