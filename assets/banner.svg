    <text x="0" y="0" text-anchor="middle" font-size="28" font-weight="800" letter-spacing="3">
      <tspan fill="#FFFFFF">ARSENIY DEYS</tspan>
      <tspan fill="#666666"> // </tspan>
      <tspan fill="#FFFFFF">INFERNOGOOD</tspan>
    </text>
    <text x="0" y="34" text-anchor="middle" font-size="12" fill="#777777" letter-spacing="2">C++ &amp; PYTHON ENGINEER • SYSTEMS • OMSTU</text>
  </g>
</svg>
