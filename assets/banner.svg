<rect x="17.5" y="17.5" width="25.0" height="2.5"/>
<rect x="2.5" y="20.0" width="7.5" height="2.5"/>
<rect x="15.0" y="20.0" width="22.5" height="2.5"/>
<rect x="40.0" y="20.0" width="2.5" height="2.5"/>
<rect x="2.5" y="22.5" width="35.0" height="2.5"/>
<rect x="5.0" y="25.0" width="32.5" height="2.5"/>
<rect x="7.5" y="27.5" width="30.0" height="2.5"/>
<rect x="10.0" y="30.0" width="25.0" height="2.5"/>
<rect x="12.5" y="32.5" width="20.0" height="2.5"/>
<rect x="15.0" y="35.0" width="15.0" height="2.5"/>
<rect x="15.0" y="37.5" width="10.0" height="2.5"/>
<rect x="27.5" y="37.5" width="5.0" height="2.5"/>
    <g class="leg-a" transform="translate(0,40)">
<rect x="15.0" y="0.0" width="7.5" height="2.5"/>
<rect x="30.0" y="0.0" width="5.0" height="2.5"/>
<rect x="15.0" y="2.5" width="5.0" height="2.5"/>
<rect x="32.5" y="2.5" width="2.5" height="2.5"/>
<rect x="15.0" y="5.0" width="2.5" height="2.5"/>
<rect x="32.5" y="5.0" width="2.5" height="2.5"/>
<rect x="15.0" y="7.5" width="5.0" height="2.5"/>
<rect x="32.5" y="7.5" width="5.0" height="2.5"/>
    </g>
    <g class="leg-b" transform="translate(0,40)">
<rect x="17.5" y="0.0" width="7.5" height="2.5"/>
<rect x="32.5" y="0.0" width="5.0" height="2.5"/>
<rect x="17.5" y="2.5" width="5.0" height="2.5"/>
<rect x="35.0" y="2.5" width="2.5" height="2.5"/>
<rect x="17.5" y="5.0" width="2.5" height="2.5"/>
<rect x="35.0" y="5.0" width="2.5" height="2.5"/>
<rect x="17.5" y="7.5" width="5.0" height="2.5"/>
<rect x="35.0" y="7.5" width="5.0" height="2.5"/>
    </g>
  </g>

  <g class="move-in">
    <g class="flash-in">
      <text class="letter" x="0" y="152">IN</text>
    </g>
  </g>
  <g class="move-fer">
    <g class="flash-fer">
      <text class="letter" x="0" y="152">FER</text>
    </g>
  </g>
  <g class="move-no">
    <g class="flash-no">
      <text class="letter" x="0" y="152">NO</text>
    </g>
  </g>
  <g class="move-good">
    <g class="flash-good">
      <text class="letter" x="0" y="152">GOOD</text>
    </g>
  </g>

  <g class="game-ui">
    <text x="720" y="40" font-size="13" fill="#666666">HI 00262  00777</text>
  </g>

  <g class="final-hero">
    <g transform="translate(-230,-45) scale(0.4)" fill="#FFFFFF">
<rect x="25.0" y="0.0" width="20.0" height="2.5"/>
<rect x="22.5" y="2.5" width="25.0" height="2.5"/>
<rect x="22.5" y="5.0" width="5.0" height="2.5"/>
<rect x="30.0" y="5.0" width="17.5" height="2.5"/>
<rect x="22.5" y="7.5" width="25.0" height="2.5"/>
